<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>E-commerce Customer Churn Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <!-- Icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

      <div class="logo">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>CHURN</span>
      </div>

      <nav class="sidebar-menu">
        <a href="#" class="menu-item active">
          <i class="fa-solid fa-house"></i>
          <span>Dashboard</span>
        </a>

        <a href="#analytics" class="menu-item">
          <i class="fa-solid fa-chart-column"></i>
          <span>Analytics</span>
        </a>

        <a href="#customers" class="menu-item">
          <i class="fa-solid fa-users"></i>
          <span>Customers</span>
        </a>

        <a href="#customers" class="menu-item">
          <i class="fa-solid fa-cart-shopping"></i>
          <span>Orders</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <i class="fa-solid fa-chart-line"></i>
        <p>Understand your customers. Reduce churn.</p>
      </div>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

      <!-- Header -->
      <header class="header">

        <div>
          <h1>E-commerce <span>Customer Churn</span></h1>
          <p>Analyze. Understand. Reduce Churn.</p>
        </div>

        <div class="header-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search"
            placeholder="Search for customers..."
            id="headerSearch">
        </div>

      </header>


      <!-- Dashboard Content -->
      <div class="content-grid">

        <!-- Chart Section -->
        <section class="card chart-card" id="analytics">

          <div class="section-header">
            <div class="section-title">
              <i class="fa-solid fa-chart-pie"></i>
              <h2>Churn Rate by Preferred Order Category</h2>
            </div>
          </div>

          <div class="chart-wrapper">
            <canvas id="churnChart"></canvas>
          </div>

        </section>


        <!-- Customer Data -->
        <section class="card table-card" id="customers">

          <div class="section-header">

            <div class="section-title">
              <i class="fa-solid fa-users"></i>
              <h2>Customer Data</h2>
            </div>

            <div class="table-search">
              <i class="fa-solid fa-magnifying-glass"></i>

              <input
                type="search"
                id="searchBox"
                placeholder="Search customers..."
                aria-label="Search customers">
            </div>

          </div>

          <p id="rowCount" class="row-count"></p>

          <div id="tableContainer" class="table-container"></div>

        </section>

      </div>

      <footer class="footer">
        E-commerce Customer Churn Dashboard
      </footer>

    </main>

  </div>


  <!-- JavaScript -->
  <script src="data.js"></script>
  <script src="table.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script src="charts.js"></script>

</body>
</html>
